name: Build iOS (unsigned IPA)

on:
push:
branches: [main]
workflow_dispatch:

env:
GODOT_VERSION: 4.7.2-stable
IOS_PRESET: iOS
NAME: ${{ github.event.repository.name }}
HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
build-ios:
runs-on: macos-15
timeout-minutes: 30

steps:
  # 0. Checkout repository
  - name: Checkout
    uses: actions/checkout@v4
    with:
      lfs: true

  # 1. Download Godot
  - name: Download Godot
    run: |
      curl -fL \
        "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip" \
        -o godot.zip

      unzip -q godot.zip -d godot

      chmod +x godot/Godot.app/Contents/MacOS/Godot

  # 2. Install iOS export templates
  - name: Install iOS export template
    run: |
      templates_root="$HOME/Library/Application Support/Godot/export_templates"
      template_dir="$templates_root/${GODOT_VERSION//-/.}"

      mkdir -p "$template_dir"

      if [ ! -f "export_templates/4.7.2.stable.tpz" ]; then
        echo "ERROR: Missing export_templates/4.7.2.stable.tpz"
        exit 1
      fi

      unzip -q "export_templates/4.7.2.stable.tpz" -d "$template_dir"

      if [ ! -f "$template_dir/ios.zip" ]; then
        echo "ERROR: ios.zip not found after extracting TPZ"
        find "$template_dir" -maxdepth 3 -type f
        exit 1
      fi

  # 3. Export Godot project to Xcode
  - name: Export to Xcode project
    run: |
      mkdir -p build/ios

      godot/Godot.app/Contents/MacOS/Godot \
        --headless \
        --path . \
        --export-release "${IOS_PRESET}" \
        "build/ios/${NAME}.xcodeproj"

  # 4. Verify Xcode project and scheme
  - name: Verify Xcode project
    run: |
      if [ ! -d "build/ios/${NAME}.xcodeproj" ]; then
        echo "ERROR: Xcode project was not generated"
        ls -la build/ios
        exit 1
      fi

      xcodebuild -list -project "build/ios/${NAME}.xcodeproj"

  # 5. Build unsigned archive
  - name: Build unsigned archive
    run: |
      set -o pipefail

      xcodebuild archive \
        -project "build/ios/${NAME}.xcodeproj" \
        -scheme "${NAME}" \
        -archivePath "build/ios/App.xcarchive" \
        -configuration Release \
        CODE_SIGN_STYLE=Manual \
        CODE_SIGN_IDENTITY="" \
        PROVISIONING_PROFILE_SPECIFIER="" \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGNING_ALLOWED=NO \
        | xcpretty

  # 6. Package IPA
  - name: Package IPA
    run: |
      cd build/ios

      mkdir -p Payload

      APP_PATH=$(find App.xcarchive/Products/Applications \
        -maxdepth 1 -name "*.app" -print -quit)

      if [ -z "$APP_PATH" ]; then
        echo "ERROR: No .app found in archive"
        exit 1
      fi

      cp -R "$APP_PATH" Payload/

      zip -qr "${NAME}.ipa" Payload

      mv "${NAME}.ipa" ../../

  # 7. Upload IPA artifact
  - name: Upload IPA artifact
    uses: actions/upload-artifact@v4
    with:
      name: unsigned-ipa
      path: ${{ env.NAME }}.ipa
      retention-days: 14
